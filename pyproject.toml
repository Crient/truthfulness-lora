[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truthfulness-lora-research"
version = "0.1.0rc1"
description = "Exploratory Qwen3-1.7B recipe comparison on TruthfulQA"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6"]

[project.optional-dependencies]
figures = ["matplotlib==3.10.8"]

[project.scripts]
truthfulness-lora = "truthfulness_lora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truthfulness_lora = ["_data/*.json"]
